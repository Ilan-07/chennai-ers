# ASSM: free-flow speed by OSM highway class, km/h.
# EVERY VALUE HERE IS A HYPOTHESIS, NOT A MEASUREMENT.
# Calibrated in build step 07 against an OSRM oracle and the published
# 108/EMRI Chennai metro response figure. Swept +/-20% in experiment E-09.
# Where an OSM `maxspeed` tag exists it OVERRIDES the class default.
status: CALIBRATED
calibrated: true
calibration:
  date: 2026-09-03
  oracle: "OSRM public demo server, car profile"
  sample: "199 stratified station->cell OD pairs, 4 distance bands, seed 20260903"
  result: {median_abs_pct_error: 0.091, bias_pct: 0.021, worst_band_bias_pct: 0.050}
  gate: {medape_le_15pct: true, band_bias_le_5pct: "at the boundary (5.0%)"}
  note: >
    The pre-calibration table was 1.77x SLOWER than the oracle uniformly across
    every distance band. A scalar rescale fitted well (x1.8, MedAPE 8.2%) but was
    rejected as a fitting artifact: it implies 144 km/h motorways and 36 km/h
    residential streets. The table below is shaped like the OSRM car profile
    instead, so every line is defensible on its own terms.
calibration_target:
  source: "108 / EMRI published Chennai metro mean response"
  value_min_s: 426      # 7.1 min
  value_max_s: 450      # 7.5 min
  tolerance_s: 60

free_flow_kmh:
  motorway: 90
  motorway_link: 45
  trunk: 85
  trunk_link: 40
  primary: 65
  primary_link: 30
  secondary: 55
  secondary_link: 25
  tertiary: 40
  tertiary_link: 20
  unclassified: 25
  residential: 25
  living_street: 10
  service: 15

# Multiplicative congestion factor applied in the `peak` scenario.
peak_factor:
  motorway: 0.65
  motorway_link: 0.65
  trunk: 0.55
  trunk_link: 0.55
  primary: 0.50
  primary_link: 0.50
  secondary: 0.50
  secondary_link: 0.50
  tertiary: 0.60
  tertiary_link: 0.60
  unclassified: 0.70
  residential: 0.75
  living_street: 0.85
  service: 0.85

# Node delay in seconds, applied at the HEAD node of each arc.
junction_delay_s:
  signalised: 12          # node tagged highway=traffic_signals
  unsignalised_degree_ge_3: 5
  other: 0

# CALIBRATION FINDING (build step 07).
# The junction term fits to a scale of 0.10 — about 1.2 s at a signal and 0.5 s
# at a junction, i.e. effectively nothing. The reason is that 86,439 of 88,143
# nodes have street_count >= 3, so OSMnx's node set is not a proxy for real
# intersections; it reflects how OSM ways happen to be split. Charging a per-node
# delay was charging a delay per topology artifact, and it made the model 1.77x
# slower than the OSRM oracle. The work the junction term was doing is done
# properly by trip_overhead_s below.
#
# E-10 ABLATION, RE-RUN AND REVERSED (data/interim/ablation_e10.json).
#
# An earlier run concluded this term should be deleted. That run scored the model
# against OD pairs sampled from station positions later shown (E-11c) to be wrong
# by up to 25 km, using a validator that omitted this very scale (F-18). On
# corrected positions, a re-queried oracle and a fixed validator:
#
#                        MedAPE    bias     worst band bias   objective
#   shipped  x0.10 + 45s   9.37%   +1.23%        6.99%          0.1259
#   ablated  x0.00 + 60s   8.60%   -1.67%        8.60%          0.1387   <- worse
#   grid best x0.075+45s   8.42%   +0.00%        8.09%          0.1151
#
# Deleting the term fits WORSE and fails the band-bias gate. RETAIN IT.
#
# Two open items. The grid optimum is now INTERIOR (x0.075), so the boundary
# artifact that motivated the ablation is gone. And nothing on the grid clears
# the 5% band-bias gate -- the best available is 6.99%. That is unresolved.
junction_delay_scale: 0.10

# Fixed per-trip overhead, seconds, added to every origin-destination travel time.
# Represents acceleration from rest and the final approach, and absorbs the turn
# penalties the oracle applies that this model does not.
# NOT the same as turnout time, which is modelled separately per service and
# must not be double-counted with this.
trip_overhead_s: 45
