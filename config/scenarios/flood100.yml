id: flood100
label: "100-year return period flood"
network_state: flood
peak: false
flood:
  return_period_years: 100
  source: chennai_flows
  layer: data/raw/chennai_flows_100yr.kml
  # Same CATEGORY schema as the 25-year layer, so the same link-state mapping
  # applies. The previous `wading_depth_m: 0.15` here was a DEAD PARAMETER —
  # nothing read it, because this layer carries no depth field to compare it
  # against. Removed rather than left to imply a depth model that does not exist.
  category_field: CATEGORY
  link_state:
    HIGH: closed
    MODERATE: wading
    LOW: passable
  wading_speed_factor: 0.35
  bridges_exempt: true
  # The study area this layer was PRODUCED for. Chennai Flows and the 2015
  # NRSC/UNOSAT survey are both corporation products; neither was drawn for the
  # built-up metro, let alone the full settlement. Declared rather than inferred,
  # because a sample's convex hull is not its domain -- points cluster where
  # flooding happened, not where the survey could have looked.
  sourced_for: gcc
weight: 0.05
