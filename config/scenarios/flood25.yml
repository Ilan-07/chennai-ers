id: flood25
label: "25-year return period flood"
network_state: flood
peak: false
flood:
  return_period_years: 25
  source: chennai_flows
  layer: data/raw/chennai_flows_25yr.kml
  # The Chennai Flows layers classify inundation by CATEGORY (LOW/MODERATE/HIGH),
  # not depth, so the link-state model is keyed to category directly rather than
  # to an assumed fording depth. The separate inundation-points layer (192 points
  # with measured depth) is retained to sanity-check this mapping, but it is far
  # too sparse to drive it.
  # ASSM: category -> link state. Ablated in E-10, swept in E-09.
  category_field: CATEGORY
  link_state:
    HIGH: closed          # impassable
    MODERATE: wading      # passable at reduced speed
    LOW: passable         # no modelled effect
  wading_speed_factor: 0.35
  bridges_exempt: true
  # The study area this layer was PRODUCED for. Chennai Flows and the 2015
  # NRSC/UNOSAT survey are both corporation products; neither was drawn for the
  # built-up metro, let alone the full settlement. Declared rather than inferred,
  # because a sample's convex hull is not its domain -- points cluster where
  # flooding happened, not where the survey could have looked.
  sourced_for: gcc
weight: 0.10
