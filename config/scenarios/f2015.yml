id: f2015
label: "November-December 2015 flood replay"
network_state: flood
peak: false
flood:
  return_period_years: null
  source: nrsc_unosat_2015
  layer: data/raw/chennai_inundation_points_depth.kml
  # 2015 is represented by observed flooding/inundation POINTS, not a modelled
  # extent, so it is buffered rather than category-classified. Reported only.
  geometry: points
  point_buffer_m: 250
  # This layer DOES carry measured depth (in inches — see the KML schema name
  # `chennai_flood_inundation_inches`), so state is set by depth against the
  # A-08 closure threshold rather than by a category mapping.
  depth_field: DEPTH
  depth_units: inches
  closure_depth_m: 0.30       # ASSM A-08
  wading_speed_factor: 0.35
  bridges_exempt: true
# Weight 0.0 — REPORTED, NEVER OPTIMISED AGAINST.
# An extreme historical event is not a design basis. (Finding F-09)
weight: 0.00
report_only: true
