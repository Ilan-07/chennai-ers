<title>Chennai Coverage Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#16283C; --navy-2:#1E3550; --ground:#F4F6F8; --panel:#FFFFFF; --panel-2:#EDF1F5;
  --ink:#16283C; --ink-2:#4A5C70; --muted:#7C8EA0; --rule:#D9E1E9;
  --green:#2E9E63; --yellow:#E8C34A; --amber:#E38B3C; --red:#D64545; --nodata:#C3CCD5;
  --accent:#2E9E63; --shadow:0 1px 2px rgba(22,40,60,.08),0 10px 28px rgba(22,40,60,.07);
  --land:#FBFCFD; --sea:#CFE0EC; --coast:#8FA8BC; --roadmaj:#9DAEBE; --roadmin:#C7D2DC;
  --wardline:#C3CFDA; --zoneline:#93A6B7; --floodfill:rgba(58,124,196,.28); --floodline:#3A7CC4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1B28; --panel:#16283C; --panel-2:#1E3550; --ink:#E8EEF4; --ink-2:#B4C4D2;
  --muted:#7C8EA0; --rule:#2A3F57; --nodata:#3A4C60;
  --green:#3FBE7C; --yellow:#EBCB63; --amber:#EE9C4E; --red:#E75C5C;
  --land:#152534; --sea:#0B1926; --coast:#3E5A74; --roadmaj:#41586F; --roadmin:#2A3D51;
  --wardline:#2A3F57; --zoneline:#4A6580; --floodfill:rgba(70,150,230,.26); --floodline:#4B93DC;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#0F1B28; --panel:#16283C; --panel-2:#1E3550; --ink:#E8EEF4; --ink-2:#B4C4D2;
  --muted:#7C8EA0; --rule:#2A3F57; --nodata:#3A4C60;
  --green:#3FBE7C; --yellow:#EBCB63; --amber:#EE9C4E; --red:#E75C5C;
  --land:#152534; --sea:#0B1926; --coast:#3E5A74; --roadmaj:#41586F; --roadmin:#2A3D51;
  --wardline:#2A3F57; --zoneline:#4A6580; --floodfill:rgba(70,150,230,.26); --floodline:#4B93DC;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{background:var(--navy);color:#E8EEF4;padding:13px 22px;display:flex;
  justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:19px;color:#fff}
header .sub{font-size:12px;color:#9DB0C4}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:#E8C34A;border:1px solid #4A6180;padding:3px 9px;border-radius:3px}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr) 292px;gap:0;
  height:calc(100vh - 52px);min-height:620px}
@media(max-width:1080px){.shell{grid-template-columns:1fr;height:auto}}
.rail{background:var(--panel);border-right:1px solid var(--rule);padding:16px 16px 26px;
  overflow-y:auto}
.side{background:var(--panel);border-left:1px solid var(--rule);padding:16px 16px 26px;
  overflow-y:auto}
.stage{position:relative;background:var(--panel-2);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
@media(max-width:1080px){.stage{height:62vh;min-height:420px}}

.grp{margin-bottom:19px}
.grp>.lbl{display:block;margin-bottom:7px}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;border:0;background:var(--panel);color:var(--ink-2);
  font:600 12.5px "Source Sans 3",sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:6px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);
  color:var(--ink);font-size:12.5px;cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--panel-2);font-weight:600}
.opt small{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.opt.report{opacity:.82}

input[type=range]{width:100%;accent-color:var(--accent)}
.thr{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.thr b{font-family:"Playfair Display",serif;font-size:27px;line-height:1}
.thr span{font-size:12px;color:var(--muted)}
.budget{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:5px}

.legend{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.sw{width:13px;height:13px;border-radius:2px;flex:none}

.readout{margin-bottom:16px}
.big{font-family:"Playfair Display",serif;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big.g{color:var(--green)} .big.a{color:var(--amber)}
.readout .cap{font-size:12px;color:var(--muted);margin-top:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;
  border-top:1px solid var(--rule);padding-top:9px;margin-top:11px}
.kv .k{color:var(--muted)}
.kv .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.kv .v.warn{color:var(--red);font-weight:600}

.btn{width:100%;padding:9px;border-radius:4px;border:1px solid var(--navy);background:var(--navy);
  color:#fff;font:600 13px "Source Sans 3",sans-serif;cursor:pointer}
.btn:hover{opacity:.9}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--rule)}
.sites{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.site{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;
  font-size:12px;padding:6px 8px;border:1px solid var(--rule);border-radius:4px}
.site .n{width:19px;height:19px;border-radius:99px;background:#7A3FBE;color:#fff;
  display:grid;place-items:center;font:600 10.5px "IBM Plex Mono",monospace}
.site .c{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}

.tip{position:absolute;pointer-events:none;background:var(--navy);color:#E8EEF4;
  padding:7px 10px;border-radius:4px;font-size:11.5px;line-height:1.4;opacity:0;
  transition:opacity .1s;box-shadow:var(--shadow);max-width:220px;z-index:5}
.tip.on{opacity:1}
.tip b{color:#fff}
.attrib{position:absolute;right:10px;bottom:10px;font-size:9.5px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;
  background:color-mix(in srgb,var(--panel) 78%,transparent);padding:3px 7px;border-radius:3px}
.scalebar{position:absolute;left:14px;bottom:12px;font-size:10px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;background:color-mix(in srgb,var(--panel) 82%,transparent);
  padding:4px 7px;border-radius:3px}
.scalebar i{display:block;height:3px;background:var(--ink-2);margin-bottom:3px}
.selbox{position:absolute;border:1.5px dashed var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;display:none}
.selpanel{background:var(--panel-2);border:1px solid var(--accent);border-radius:5px;
  padding:12px 13px;margin-bottom:16px}
.selpanel h2{font-size:15px;margin-bottom:2px}
.selhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.selhead button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11.5px;
  text-decoration:underline;padding:0}
.resp{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:9px}
.resp th{text-align:left;font:600 10px "IBM Plex Mono",monospace;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:0 0 4px}
.resp td{padding:4px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.resp td.t{font-family:"IBM Plex Mono",monospace;text-align:right}
.resp .rk{width:17px;height:17px;border-radius:99px;display:inline-grid;place-items:center;
  font:600 9.5px "IBM Plex Mono",monospace;color:#fff;margin-right:6px}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;
  background:var(--ground);color:var(--muted);font-size:13px;text-align:center;padding:24px}
#boot b{display:block;font-family:"Playfair Display",serif;font-size:21px;color:var(--ink);
  margin-bottom:7px}
.band{margin-top:7px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.band .rng{font-family:"IBM Plex Mono",monospace}
.band .wide{color:var(--amber);font-weight:600}
.errbar{position:relative;height:7px;background:var(--panel-2);border-radius:99px;margin:7px 0 5px}
.errbar i{position:absolute;top:0;bottom:0;border-radius:99px}
.errbar .wideb{background:color-mix(in srgb,var(--amber) 42%,transparent)}
.errbar .tight{background:var(--green)}
.errbar .pt{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink)}
.idlist{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.idrow{display:grid;grid-template-columns:11px 1fr auto;gap:7px;align-items:center;font-size:11.5px}
.idrow i{width:9px;height:9px;border-radius:99px;display:block}
.idrow .c{font-family:"IBM Plex Mono",monospace;color:var(--muted)}
.wardtbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.wardtbl th{text-align:left;font:600 10px "IBM Plex Mono",monospace;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:0 0 4px}
.wardtbl td{padding:3px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.wardtbl td.n{font-family:"IBM Plex Mono",monospace}
.wardtbl td.bad{color:var(--red);font-weight:600}
.cmp{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:11.5px;margin-top:9px;
  padding-top:8px;border-top:1px solid var(--rule)}
.cmp .v{font-family:"IBM Plex Mono",monospace}
.caveat{margin-top:15px;padding:10px 11px;border-left:2px solid var(--amber);
  background:var(--panel-2);font-size:11.5px;color:var(--ink-2);border-radius:0 3px 3px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
